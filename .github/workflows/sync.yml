name: Sync WeRead Data

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  sync-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch latest WeRead data
        run: node fetch.js

      - name: Build website
        run: node build-v3.js

      - name: Copy output to repo root
        run: |
          cp /home/node/.openclaw/workspace/weread-website/index.html ./
          cp /home/node/.openclaw/workspace/weread-data/all-data.json ./

      - name: Commit changes
        run: |
          git config user.name "morninghshs"
          git config user.email "morninghshs@users.noreply.github.com"
          git add index.html all-data.json
          git diff --exit-code --quiet || git commit -m "Sync: $(date '+%Y-%m-%d %H:%M')"
          git push || echo "No changes"

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload to Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'index.html'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

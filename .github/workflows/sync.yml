name: Sync WeRead Data

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch latest data
        env:
          WEREAD_API_KEY: ${{ secrets.WEREAD_API_KEY }}
        run: node fetch.js

      - name: Build website
        env:
          WEREAD_API_KEY: ${{ secrets.WEREAD_API_KEY }}
        run: node build-v3.js

      - name: Copy output
        run: |
          cp /home/node/.openclaw/workspace/weread-website/index.html ./
          cp /home/node/.openclaw/workspace/weread-data/all-data.json ./

      - name: Deploy to GitHub Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'index.html'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Commit changes
        if: always()
        run: |
          git config user.name "morninghshs"
          git config user.email "morninghshs@users.noreply.github.com"
          git add index.html all-data.json
          git diff --exit-code --quiet || git commit -m "Sync: $(date '+%Y-%m-%d %H:%M')"
          git push || true

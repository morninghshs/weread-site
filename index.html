<!DOCTYPE html>
<html lang=zh-CN>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>阅读宇宙 — 微信读书</title>
<style>

@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&family=Noto+Sans+SC:wght@300;400;500;700&display=swap');

* { margin:0; padding:0; box-sizing:border-box; }
:root {
  --bg: #0a0a0f; --bg2: #101018; --bg3: #181824; --bg4: #20202e;
  --border: rgba(255,255,255,0.06); --border2: rgba(255,255,255,0.1);
  --text: #e8e6e3; --text2: #9b97a0; --text3: #5b5763;
  --accent: #c4a35a; --accent2: rgba(196,163,90,0.15); --accent3: rgba(196,163,90,0.08);
  --blue: rgba(100,181,246,0.3); --green: rgba(129,199,132,0.15);
  --sidebar-w: 300px;
}
html { scroll-behavior: smooth; }
body { font-family:'Noto Sans SC',sans-serif; background:var(--bg); color:var(--text); line-height:1.7; height:100vh; overflow:hidden; }

/* LAYOUT */
.app { display:flex; height:100vh; }

/* SIDEBAR */
.sidebar {
  width:var(--sidebar-w); min-width:var(--sidebar-w); height:100vh;
  background:var(--bg2); border-right:1px solid var(--border);
  display:flex; flex-direction:column; overflow:hidden;
  transition: transform 0.3s ease;
  z-index: 100;
}
.sidebar-head { padding:20px 16px 12px; border-bottom:1px solid var(--border); flex-shrink:0; }
.sidebar-brand { font-family:'Noto Serif SC',serif; font-size:1.1rem; font-weight:700; color:var(--accent); margin-bottom:12px; letter-spacing:1px; }
.sidebar-stats { display:grid; grid-template-columns:repeat(3,1fr); gap:6px; }
.mini-stat { text-align:center; padding:6px 4px; background:var(--bg3); border-radius:8px; }
.mini-stat .val { font-size:0.95rem; font-weight:700; color:var(--accent); }
.mini-stat .lbl { font-size:0.6rem; color:var(--text3); margin-top:1px; }

.search-wrap { padding:10px 12px; flex-shrink:0; }
.search-input {
  width:100%; padding:8px 12px 8px 32px; background:var(--bg3); border:1px solid var(--border);
  border-radius:8px; color:var(--text); font-size:0.82rem; outline:none;
}
.search-input:focus { border-color:var(--accent); }
.search-icon { position:absolute; left:24px; top:50%; transform:translateY(-50%); color:var(--text3); font-size:0.75rem; pointer-events:none; }
.search-wrap { position:relative; }

.sort-bar { display:flex; gap:4px; padding:0 12px 8px; flex-shrink:0; }
.sort-btn {
  padding:4px 10px; font-size:0.7rem; background:transparent; border:1px solid var(--border);
  border-radius:12px; color:var(--text3); cursor:pointer; transition:all 0.2s;
}
.sort-btn.active { border-color:var(--accent); color:var(--accent); background:var(--accent3); }

.book-list { flex:1; overflow-y:auto; padding:4px 8px 80px; }
.book-list::-webkit-scrollbar { width:4px; }
.book-list::-webkit-scrollbar-thumb { background:var(--bg4); border-radius:4px; }

.book-item {
  display:flex; align-items:center; gap:10px; padding:10px 8px;
  border-radius:8px; cursor:pointer; transition:all 0.2s; border:1px solid transparent;
}
.book-item:hover { background:var(--bg3); }
.book-item.active { background:var(--accent3); border-color:var(--accent2); }
.book-item .thumb {
  width:36px; height:50px; border-radius:4px; overflow:hidden; flex-shrink:0; background:var(--bg4);
}
.book-item .thumb img { width:100%; height:100%; object-fit:cover; }
.book-item .info { flex:1; min-width:0; }
.book-item .btitle { font-size:0.82rem; font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.book-item .bmeta { font-size:0.65rem; color:var(--text3); margin-top:2px; display:flex; gap:6px; }
.book-item .bcount { color:var(--accent); }

/* MAIN */
.main { flex:1; overflow-y:auto; background:var(--bg); }
.main::-webkit-scrollbar { width:6px; }
.main::-webkit-scrollbar-thumb { background:var(--bg4); border-radius:4px; }

/* OVERVIEW (default view) */
.overview { padding:40px 40px 60px; max-width:860px; margin:0 auto; }
.overview-title {
  font-family:'Noto Serif SC',serif; font-size:1.6rem; font-weight:700;
  background:linear-gradient(135deg,var(--text) 30%,var(--accent));
  -webkit-background-clip:text; -webkit-text-fill-color:transparent;
  margin-bottom:8px;
}
.overview-sub { color:var(--text2); font-size:0.9rem; margin-bottom:32px; }

.stat-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); gap:12px; margin-bottom:36px; }
.stat-card { background:var(--bg2); border:1px solid var(--border); border-radius:10px; padding:18px 14px; text-align:center; }
.stat-card .num { font-family:'Noto Serif SC',serif; font-size:1.8rem; font-weight:700; color:var(--accent); }
.stat-card .desc { font-size:0.8rem; color:var(--text2); margin-top:4px; }

.section-h { font-family:'Noto Serif SC',serif; font-size:1.15rem; font-weight:600; margin-bottom:16px; padding-left:12px; border-left:3px solid var(--accent); }

.cat-cloud { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:32px; }
.cat-tag { background:var(--accent2); color:var(--accent); padding:5px 12px; border-radius:14px; font-size:0.82rem; }

.time-chart { background:var(--bg2); border:1px solid var(--border); border-radius:10px; padding:20px; margin-bottom:32px; }
.time-chart-title { font-size:0.85rem; color:var(--text2); margin-bottom:14px; }
.time-bars { display:flex; align-items:flex-end; gap:3px; height:100px; }
.time-col { flex:1; display:flex; flex-direction:column; align-items:center; height:100%; justify-content:flex-end; }
.time-col .bar { width:100%; max-width:24px; background:linear-gradient(to top,var(--accent),rgba(196,163,90,0.3)); border-radius:3px 3px 0 0; min-height:2px; transition:opacity 0.2s; }
.time-col .bar:hover { opacity:0.75; }
.time-col .lbl { font-size:0.55rem; color:var(--text3); margin-top:5px; }

.author-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:8px; }
.author-row { display:flex; justify-content:space-between; padding:8px 14px; background:var(--bg2); border:1px solid var(--border); border-radius:8px; font-size:0.85rem; }
.author-row .name { color:var(--text); }
.author-row .cnt { color:var(--accent); font-weight:600; }

/* BOOK DETAIL */
.book-detail { padding:40px 40px 60px; max-width:860px; margin:0 auto; display:none; animation:fadeIn 0.3s ease; }
@keyframes fadeIn { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }

.book-header { display:flex; gap:24px; margin-bottom:28px; align-items:flex-start; }
.book-header .cover { width:100px; height:140px; border-radius:8px; overflow:hidden; flex-shrink:0; box-shadow:0 4px 20px rgba(0,0,0,0.5); }
.book-header .cover img { width:100%; height:100%; object-fit:cover; }
.book-header .info { flex:1; }
.book-header .title { font-family:'Noto Serif SC',serif; font-size:1.4rem; font-weight:700; margin-bottom:4px; }
.book-header .author { font-size:0.9rem; color:var(--text2); margin-bottom:12px; }
.book-header .meta-tags { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:10px; }
.book-header .tag { font-size:0.72rem; padding:3px 10px; background:rgba(255,255,255,0.05); border-radius:10px; color:var(--text2); }
.book-header .tag-done { background:var(--green); color:#81c784; }
.book-header .tag-reading { background:rgba(66,165,245,0.15); color:#64b5f6; }
.progress-bar { height:4px; background:rgba(255,255,255,0.06); border-radius:2px; max-width:300px; }
.progress-fill { height:100%; background:linear-gradient(90deg,var(--accent),rgba(196,163,90,0.5)); border-radius:2px; }

.detail-nav { display:flex; gap:12px; margin-bottom:24px; border-bottom:1px solid var(--border); padding-bottom:0; }
.detail-tab { padding:10px 18px; font-size:0.85rem; color:var(--text3); cursor:pointer; border-bottom:2px solid transparent; transition:all 0.2s; background:none; border-top:none; border-left:none; border-right:none; }
.detail-tab.active { color:var(--accent); border-bottom-color:var(--accent); }

.chapter-group { margin-bottom:24px; }
.chapter-title { font-family:'Noto Serif SC',serif; font-size:0.92rem; font-weight:600; color:var(--accent); padding:8px 0; border-bottom:1px solid var(--border); margin-bottom:10px; }

.review-item { padding:14px 0; border-bottom:1px solid rgba(255,255,255,0.03); }
.review-item:last-child { border-bottom:none; }
.review-quote { font-family:'Noto Serif SC',serif; font-style:italic; color:var(--text2); padding:8px 14px; border-left:2px solid var(--accent2); margin-bottom:8px; font-size:0.88rem; line-height:1.85; }
.review-content { font-size:0.92rem; line-height:1.85; color:var(--text); }
.review-hint { font-size:0.78rem; color:var(--text3); margin-top:8px; padding:6px 10px; background:var(--accent3); border-radius:6px; }
.review-meta { font-size:0.72rem; color:var(--text3); margin-top:6px; }
.bookmark-item { padding:10px 0; border-bottom:1px solid rgba(255,255,255,0.03); }
.bookmark-text { font-family:'Noto Serif SC',serif; color:var(--text2); padding:10px 14px; border-left:2px solid var(--blue); font-size:0.88rem; line-height:1.85; }
.bookmark-time { font-size:0.7rem; color:var(--text3); margin-top:5px; }

/* Mobile hamburger */
.hamburger { display:none; position:fixed; top:12px; left:12px; z-index:200; width:40px; height:40px; background:var(--bg3); border:1px solid var(--border); border-radius:8px; cursor:pointer; align-items:center; justify-content:center; font-size:1.2rem; color:var(--text2); }
.overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.5); z-index:90; }

.empty-hint { text-align:center; padding:80px 20px; color:var(--text3); font-size:0.9rem; }

.sync-bar { padding:6px 12px; text-align:center; font-size:0.65rem; color:var(--text3); background:var(--bg); border-top:1px solid var(--border); flex-shrink:0; }

@media(max-width:768px) {
  .hamburger { display:flex; }
  .sidebar { position:fixed; left:0; top:0; transform:translateX(-100%); }
  .sidebar.open { transform:translateX(0); }
  .overlay.show { display:block; }
  .overview, .book-detail { padding:60px 20px 40px; }
  .book-header { flex-direction:column; align-items:center; text-align:center; }
  .book-header .meta-tags { justify-content:center; }
  .progress-bar { max-width:100%; }
}

</style>
</head>
<body>

<button class=hamburger onclick=toggleSidebar()>☰</button>
<div class=overlay onclick=toggleSidebar()></div>

<div class=app>
  <aside class=sidebar id=sidebar>
    <div class=sidebar-top>
      <div class=brand><span class=brand-icon>📚</span><div><div>阅读宇宙</div><div class=brand-sub>微信读书</div></div></div>
      <div class=quick-stats>
        <div class=qs><div class=v id=s-days>--</div><div class=l>天</div></div>
        <div class=qs><div class=v id=s-books>--</div><div class=l>书</div></div>
        <div class=qs><div class=v id=s-reviews>--</div><div class=l>想法</div></div>
        <div class=qs><div class=v id=s-marks>--</div><div class=l>划线</div></div>
      </div>
    </div>
    <div class=search-wrap>
      <span class=si-icon>🔍</span>
      <input class=si placeholder="搜索书名或作者…" oninput=onSearch(this.value)>
    </div>
    <div class=sort-bar>
      <button class="sb on" onclick=setSort("reviews",this)>想法数</button>
      <button class=sb onclick=setSort("progress",this)>阅读进度</button>
      <button class=sb onclick=setSort("recent",this)>最近活跃</button>
    </div>
    <div class=book-list id=bookList><div class=empty><div class=empty-icon>⏳</div>加载中...</div></div>
  </aside>
  <main class=main id=mainArea>
    <div class=overview id=ov></div>
    <div class=book-detail id=bkDetail></div>
  </main>
</div>

<div class=nav-bar>
  <div class="nav-item on" onclick=goHome()>🏠 首页</div>
  <div class=nav-item onclick=goHome()>📊 统计</div>
  <div class=nav-item onclick=goHome()>📚 书架</div>
  <div class=nav-item onclick=goHome()>💡 关于</div>
</div>

<script>
var BOOKS = [];
var RD = null;
var HINTS = ["💡 这个观点如何应用到你当下的生活中？","💡 如果反过来想，会得出什么结论？","💡 这个洞察能否解释你最近观察到的某个现象？","💡 试着用一句话向朋友复述这个想法。","💡 这个道理在你人生的哪个阶段会有不同的理解？","💡 如果这是真的，你需要改变什么行为？","💡 这和你的直觉反应一致吗？为什么？","💡 你能想到一个反例吗？"];
var curSort = "reviews";
var sel = -1;
var curTab = "reviews";

function renderOverview() {
  if(!RD) return;
  var ov = document.getElementById('ov');
  var rs = RD.readStat || [];
  var pc = (RD.preferCategory||[]).slice(0,12).map(c=>'<span class=tag>'+esc(c.categoryTitle||c.parentCategoryTitle||'')+'</span>').join('');
  var pa = (RD.preferAuthor||[]).slice(0,12).map(a=>'<div class=au-row><span class=n>'+esc(a.name)+'</span><span class=c>'+(a.count||0)+'本</span></div>').join('');
  var pt = RD.preferTime||[];
  var maxT = Math.max.apply(null, pt.length?pt:[1]);
  var tb = pt.map(function(v,i){ var h=(6+i)%24; return '<div class=tc><div class=bar style="height:'+Math.max(v/maxT*100,1)+'%"></div><div class=lbl>'+h+'</div></div>'; }).join('');
  var sc = rs.map(function(s){ return '<div style="text-align:center;padding:10px;background:var(--bg2);border:1px solid var(--border);border-radius:8px"><div style="font-size:1.1rem;font-weight:700;color:var(--accent)">'+esc(s.counts||'')+'</div><div style="font-size:0.65rem;color:var(--text3);margin-top:2px">'+esc(s.stat||'')+'</div></div>'; }).join('');
  var recent = [];
  BOOKS.forEach(function(b){ (b.reviews||[]).forEach(function(r){ if(r.createTime) recent.push({content:r.content,abstract:r.abstract,createTime:r.createTime,chapterName:r.chapterName,star:r.star,bookTitle:b.title,bookCover:b.cover}); }); });
  recent.sort(function(a,b){ return b.createTime-a.createTime; });
  var rh = recent.slice(0,10).map(function(r){
    var hash=(r.content||'').split('').reduce(function(h,c){ return ((h<<5)-h+c.charCodeAt(0))|0; },0);
    return '<div class=tl-item><div class=tl-book>'+(r.bookCover?'<img src="'+esc(r.bookCover)+'">':'📚')+'</div><div class=tl-content><div class=tl-book-title>📖 '+esc(r.bookTitle||'')+'</div>'+(r.abstract?'<div class=rev-quote style="margin-bottom:5px">'+esc(r.abstract)+'</div>':'')+(r.content?'<div class=tl-text>'+esc(r.content)+'</div><div class=tl-hint>'+HINTS[Math.abs(hash)%HINTS.length]+'</div>':'')+(r.createTime?'<div class=tl-time>'+fmtDate(r.createTime)+'</div>':'')+'</div></div>';
  }).join('');
  ov.innerHTML = '<div class=ov-head><h1 class=ov-title>阅读宇宙</h1><p class=ov-sub>'+RD.readDays+' 天阅读旅程 · '+fmtTime(RD.totalReadTime)+' 沉浸时光</p></div>'
    + '<div class=ov-grid>'
    + '<div class=ov-card><div class=n>'+RD.readDays+'</div><div class=d>阅读天数</div></div>'
    + '<div class=ov-card><div class=n>'+fmtTime(RD.totalReadTime)+'</div><div class=d>累计阅读</div></div>'
    + '<div class=ov-card><div class=n>'+BOOKS.length+'</div><div class=d>记录书籍</div></div>'
    + '<div class=ov-card><div class=n>'+(RD.totalReviews||0)+'</div><div class=d>想法/点评</div></div>'
    + '<div class=ov-card><div class=n>'+(RD.totalBookmarks||0)+'</div><div class=d>划线摘录</div></div>'
    + '</div>'
    + (sc?'<div class=ov-section><h2 class=ov-h>阅读统计</h2><div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(80px,1fr));gap:6px">'+sc+'</div></div>':'')
    + (pc?'<div class=ov-section><h2 class=ov-h>偏好分类</h2><div class=tag-cloud>'+pc+'</div></div>':'')
    + '<div class=ov-section><h2 class=ov-h>阅读时段</h2><div class=time-wrap><div class=time-title>🕐 24 小时阅读节奏（6:00 - 次日 5:00）</div><div class=time-bars>'+tb+'</div></div></div>'
    + (pa?'<div class=ov-section><h2 class=ov-h>偏好作者</h2><div class=au-grid>'+pa+'</div></div>':'')
    + (rh?'<div class=ov-section><h2 class=ov-h>最近想法</h2>'+rh+'</div>':'');
}

function renderList() {
  var el = document.getElementById('bookList');
  var q = (document.querySelector('.si')||{value:''}).value.toLowerCase();
  var arr = BOOKS.map(function(b,i){ return {b:b,i:i}; });
  if(q) arr = arr.filter(function(x){ return (x.b.title||'').toLowerCase().indexOf(q)!==-1||(x.b.author||'').toLowerCase().indexOf(q)!==-1; });
  if(curSort==="reviews") arr.sort(function(a,b){ return (b.b.reviews?b.b.reviews.length:0)-(a.b.reviews?a.b.reviews.length:0); });
  else if(curSort==="progress") arr.sort(function(a,b){ return (b.b.readingProgress||0)-(a.b.readingProgress||0); });
  else if(curSort==="recent") arr.sort(function(a,b){ return (b.b.sort||0)-(a.b.sort||0); });
  if(!arr.length){ el.innerHTML='<div class=empty><div class=empty-icon>📭</div>没有找到匹配的书籍</div>'; return; }
  var html = "";
  for(var i=0;i<arr.length;i++){
    var b=arr[i].b, idx=arr[i].i, selCls=idx===sel?" sel":"";
    var cov=b.cover?'<img src="'+esc(b.cover)+'" loading=lazy alt="">':'📚';
    var rlen=b.reviews?b.reviews.length:0, blen=b.bookmarks?b.bookmarks.length:0;
    html += '<div class="bi'+selCls+'" onclick="selectBook('+idx+')">'
      + '<div class=cov>'+cov+'</div>'
      + '<div class=if><div class=ti>'+esc(b.title||'')+'</div><div class=ml><span class=mc>'+rlen+' 想法</span><span>'+blen+' 划线</span></div></div>'
      + '<span class=ic>›</span></div>';
  }
  el.innerHTML = html;
}

function selectBook(idx) {
  sel=idx; renderList();
  var b = BOOKS[idx];
  document.getElementById('ov').style.display='none';
  var el = document.getElementById('bkDetail');
  el.style.display='block';
  var pg=b.readingProgress||0, done=b.markedStatus===2||pg>=100;
  var rc=b.reviews?b.reviews.length:0, bc=b.bookmarks?b.bookmarks.length:0;
  var cov=b.cover?'<img src="'+esc(b.cover)+'" alt="">':'📚';
  var tags='<span class="bk-tag">💬 '+rc+' 想法</span><span class="bk-tag">🔖 '+bc+' 划线</span>';
  if(done) tags+='<span class="bk-tag done">✓ 已读完</span>';
  else if(pg>0) tags+='<span class="bk-tag reading">'+pg+'%</span>';
  el.innerHTML='<div class=bk-hdr>'
    + '<div class=bk-cov>'+cov+'</div>'
    + '<div class=bk-info>'
    + '<div class=bk-title>'+esc(b.title||'')+'</div>'
    + '<div class=bk-author>'+esc(b.author||'')+'</div>'
    + '<div class=bk-meta>'+tags+'</div>'
    + '<div class=bk-prog><div class=bk-prog-bar><div class=bk-prog-fill style="width:'+Math.min(pg,100)+'%"></div></div><div class=bk-prog-pct>'+pg+'%</div></div>'
    + '</div></div>'
    + '<div class=detail-tabs>'
    + '<button class="dt on" id=tab-reviews onclick="showTab(\'reviews\')">💬 想法 ('+rc+')</button>'
    + (bc>0?'<button class=dt id=tab-bookmarks onclick="showTab(\'bookmarks\')">🔖 划线 ('+bc+')</button>':'')
    + '</div>'
    + '<div id=content-reviews>'+(rc>0?buildReviews(b.reviews||[]):'<div class=empty><div class=empty-icon>💭</div>暂无想法</div>')+'</div>'
    + '<div id=content-bookmarks style="display:none">'+(bc>0?buildBookmarks(b.bookmarks||[]):'<div class=empty><div class=empty-icon>📝</div>暂无划线</div>')+'</div>';
  document.getElementById('mainArea').scrollTop=0;
  if(window.innerWidth<=768) toggleSidebar();
}

function buildReviews(reviews) {
  var groups={}, noCh=[];
  for(var i=0;i<reviews.length;i++){
    var r=reviews[i];
    if(r.chapterName){ if(!groups[r.chapterName]) groups[r.chapterName]=[]; groups[r.chapterName].push(r); }
    else noCh.push(r);
  }
  var html="";
  for(var ch in groups){
    html+='<div class=chapter-group><div class=chapter-title>📖 '+esc(ch)+'</div>';
    for(var j=0;j<groups[ch].length;j++) html+=buildRevItem(groups[ch][j]);
    html+='</div>';
  }
  if(noCh.length){
    html+='<div class=chapter-group><div class=chapter-title>📝 其他想法</div>';
    for(var k=0;k<noCh.length;k++) html+=buildRevItem(noCh[k]);
    html+='</div>';
  }
  return html;
}

function buildRevItem(r) {
  var h='<div class=rev-item>';
  if(r.abstract) h+='<div class=rev-quote>'+esc(r.abstract)+'</div>';
  if(r.content){
    h+='<div class=rev-content>'+esc(r.content)+'</div>';
    var hash=0;
    for(var i=0;i<r.content.length;i++) hash=((hash<<5)-hash+r.content.charCodeAt(i))|0;
    h+='<div class=rev-hint>'+HINTS[Math.abs(hash)%HINTS.length]+'</div>';
  }
  var meta=[];
  if(r.star&&r.star>0) meta.push(starHtml(r.star));
  if(r.createTime) meta.push(fmtDate(r.createTime));
  if(meta.length) h+='<div class=rev-meta>'+meta.join(' · ')+'</div>';
  h+='</div>';
  return h;
}

function buildBookmarks(bms) {
  var html="";
  for(var i=0;i<bms.length;i++){
    var b=bms[i];
    if(b.markText) html+='<div class=bm-item><div class=bm-text>'+esc(b.markText)+'</div>'+(b.createTime?'<div class=bm-time>'+fmtDate(b.createTime)+'</div>':'')+'</div>';
  }
  return html;
}

function showTab(tab){
  curTab=tab;
  document.querySelectorAll('.dt').forEach(function(d){ d.classList.remove('on'); });
  document.getElementById('tab-'+tab).classList.add('on');
  document.getElementById('content-reviews').style.display=tab==='reviews'?'':'none';
  document.getElementById('content-bookmarks').style.display=tab==='bookmarks'?'':'none';
}

function setSort(mode,btn){
  curSort=mode;
  document.querySelectorAll('.sb').forEach(function(b){ b.classList.remove('on'); });
  btn.classList.add('on');
  renderList();
}

function onSearch(q){ renderList(); }

function goHome(){
  sel=-1; renderList();
  document.getElementById('ov').style.display='';
  document.getElementById('bkDetail').style.display='none';
  document.getElementById('mainArea').scrollTop=0;
}

function toggleSidebar(){
  document.getElementById('sidebar').classList.toggle('open');
  document.querySelector('.overlay').classList.toggle('show');
}

function fmtDate(ts){ if(!ts) return ''; var d=new Date(ts*1000); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function fmtTime(s){ if(!s) return '0分钟'; var h=Math.floor(s/3600),m=Math.floor((s%3600)/60); return h>0?h+'小时'+m+'分钟':m+'分钟'; }

// Load data
fetch('all-data.json').then(function(r){ return r.json(); }).then(function(data){
  BOOKS = data.books || [];
  RD = {
    readDays: data.readData?data.readData.readDays||0:0,
    totalReadTime: data.readData?data.readData.totalReadTime||0:0,
    totalReviews: data.totalReviews||0,
    totalBookmarks: data.totalBookmarks||0,
    readStat: data.readData?data.readData.readStat||[]:[],
    preferCategory: data.readData?data.readData.preferCategory||[]:[],
    preferAuthor: data.readData?data.readData.preferAuthor||[]:[],
    preferTime: data.readData?data.readData.preferTime||[]:[]
  };
  document.getElementById('s-days').textContent = RD.readDays;
  document.getElementById('s-books').textContent = data.books?data.books.length:0;
  document.getElementById('s-reviews').textContent = data.totalReviews||0;
  document.getElementById('s-marks').textContent = data.totalBookmarks||0;
  renderOverview();
  renderList();
}).catch(function(e){ 
  document.getElementById('bookList').innerHTML='<div class=empty><div class=empty-icon>❌</div>数据加载失败: '+e.message+'</div>'; 
});
